name: ci

on:
  # Pull requests are checked by the pull_request event; checking their
  # branch pushes as well would run every check twice.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"  # weekly on monday — catches new vulnerabilities
  workflow_dispatch:  # run by hand on a branch without a pull request

# A new commit on a pull request cancels the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go mod verify
        run: go mod verify

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: -v

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

      - name: typos
        uses: crate-ci/typos@v1.52.0
